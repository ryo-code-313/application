<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミュウツー厳選チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0F8;--card:#FFFFFF;--ink:#2B1D3F;--muted:#7A6B8E;--line:#E2D8EC;
  --psy:#7B3FB5;--psy-soft:#EFE4F8;--tail:#B4539C;--tail-soft:#F8E3F1;--bar:#2B1D3F;--bar-ink:#FFFFFF;--bar-muted:#C9B8DE;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150E1F;--card:#221832;--ink:#EDE6F5;--muted:#A99BBC;--line:#382A4D;
  --psy:#B98AF0;--psy-soft:#33224B;--tail:#E58BCB;--tail-soft:#3E2139;--bar:#EDE6F5;--bar-ink:#1B1228;--bar-muted:#6E5D83;}}
:root[data-theme="dark"]{
  --bg:#150E1F;--card:#221832;--ink:#EDE6F5;--muted:#A99BBC;--line:#382A4D;
  --psy:#B98AF0;--psy-soft:#33224B;--tail:#E58BCB;--tail-soft:#3E2139;--bar:#EDE6F5;--bar-ink:#1B1228;--bar-muted:#6E5D83;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:22px 16px calc(120px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{margin:0;font-size:1.9rem;font-weight:900;letter-spacing:.04em;line-height:1.1}
header h1 small{display:block;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.base{text-align:right;font-size:.75rem;color:var(--muted);font-weight:700}
.base b{display:block;font-size:1.1rem;color:var(--psy);font-variant-numeric:tabular-nums}
section{background:var(--card);border-radius:22px;padding:16px 14px;margin-bottom:12px}
h2{font-size:.95rem;font-weight:900;margin:0 0 10px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding:8px 0}
.slot+.slot{border-top:1px dashed var(--line)}
.slot>span{font-weight:900;font-size:.85rem;color:var(--muted);padding-top:9px;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{font:inherit;font-weight:700;font-size:.82rem;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:9px 2px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--psy);border-color:var(--psy);color:#fff}
.chip.hb{border-style:dashed}
.chip:disabled{opacity:.3;cursor:not-allowed}
.chips.six{grid-template-columns:repeat(3,1fr)}
.stat.wide{grid-column:1/-1}
.down .chip[aria-pressed="true"]{background:var(--tail);border-color:var(--tail)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--tail);outline-offset:2px}
select,input{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;width:100%}
.natname{margin-top:10px;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--psy-soft);border-radius:14px;padding:10px 6px;text-align:center}
.stat small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.stat b{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fields label{font-size:.7rem;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.check{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;font-weight:700;color:var(--muted)}
.check input{width:auto}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.82rem}
.log li:first-child{border-top:none}
.log .m{font-size:.7rem;color:var(--muted)}
.log b{font-variant-numeric:tabular-nums;color:var(--psy)}
.del{font:inherit;font-size:.75rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.empty{font-size:.8rem;color:var(--muted);margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center}
.bar small{display:block;font-size:.66rem;color:var(--bar-muted);font-weight:700}
.bar b{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.bar b.dim{color:var(--bar-muted)}
.bar .pos{font-size:.72rem;font-weight:700;color:var(--bar-muted);margin-left:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rankcell b{display:inline}
.save{font:inherit;font-weight:900;font-size:.8rem;background:var(--tail);color:#fff;border:none;border-radius:12px;padding:10px 12px;cursor:pointer}
.save:disabled{opacity:.35}
.memo{margin-top:10px}
.reset{font:inherit;font-size:.8rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;display:block;margin:0 auto 12px;padding:6px}
@media (max-width:380px){.bar b{font-size:1.1rem}.save{padding:10px 9px}}
.perf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.perf-head h2{margin:0}
.sws{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cond{font-size:.72rem;color:var(--muted);font-weight:700;margin:0 0 10px}
.switch{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;border:none;padding:0;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--psy)}
.switch input:checked::after{transform:translateX(18px)}
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:12px}
.hero .stat b{font-size:1.4rem}
.hero .stat.main{background:var(--psy);color:#fff}
.hero .stat.main small{color:#fff;opacity:.85}
dl.rows{margin:0;display:grid;grid-template-columns:1fr auto;column-gap:12px}
dl.rows dt,dl.rows dd{padding:9px 0;border-top:1px solid var(--line);font-size:.85rem}
dl.rows dt{color:var(--muted);font-weight:700}
dl.rows dd{margin:0;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
dl.rows dd span{display:block;font-size:.7rem;font-weight:500;color:var(--muted)}
dl.rows .grp{grid-column:1/-1;border-top:none;padding:14px 0 2px;font-size:.75rem;color:var(--psy);font-weight:900}
@media (prefers-reduced-motion:reduce){.switch input,.switch input::after{transition:none}}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.mode button{font:inherit;font-weight:900;font-size:.85rem;border:none;border-radius:10px;padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--psy);color:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1>ミュウツー<small>スキル型 厳選チェッカー</small></h1>
    <div class="base">基準 <b>38:20</b>スキル確率 2.9%・天井 62回</div>
  </header>

  <div class="mode" role="group" aria-label="対象レベル"><button data-n="3">Lv.50まで（3枠）</button><button data-n="4">Lv.70まで（4枠）</button></div>

  <section>
    <h2>サブスキル</h2>
    <div id="slots"></div>
  </section>

  <section>
    <h2>性格</h2>
    <div class="slot"><span>▲上昇</span><div class="chips" id="up"></div></div>
    <div class="slot down"><span>▼下降</span><div class="chips" id="down"></div></div>
    <div class="natname"><span>性格名</span><select id="nat"></select></div>
  </section>

  <section>
    <div class="perf-head"><h2>性能</h2><div class="sws"><label class="switch"><input type="checkbox" id="camp" role="switch">いいキャンプチケット</label><label class="switch"><input type="checkbox" id="g80" role="switch">げんき常時81%以上</label></div></div>
    <p class="cond" id="cond"></p>
    <div class="hero">
      <div class="stat main"><small>1日の期待発動回数</small><b id="hAll">—</b></div>
      <div class="stat"><small>日中</small><b id="hDay">—</b></div>
      <div class="stat"><small>睡眠中</small><b id="hNight">—</b></div>
    </div>
    <dl class="rows">
      <dt class="grp">おてつだい</dt><dd class="grp" style="display:none"></dd>
      <dt>おてつだい時間</dt><dd id="rTime">—</dd>
      <dt>時間の短縮</dt><dd id="rCut">—</dd>
      <dt>1日のおてつだい回数</dt><dd id="rHelps">—</dd>
      <dt>最大所持数</dt><dd id="rCap">—</dd>
      <dt>睡眠中のスキル抽選</dt><dd id="rRoll">—</dd>
      <dt class="grp">スキル</dt><dd class="grp" style="display:none"></dd>
      <dt>スキル確率</dt><dd id="rRate">—</dd>
      <dt>天井込みの実質確率</dt><dd id="rEff">—</dd>
      <dt>発動までの平均おてつだい</dt><dd id="rAvg">—</dd>
      <dt>発動までの平均時間</dt><dd id="rAvgT">—</dd>
      <dt class="grp">無補正個体との比較</dt><dd class="grp" style="display:none"></dd>
      <dt>無補正個体の1日回数</dt><dd id="rBase">—</dd>
      <dt>1日の回数の比（順位の基準）</dt><dd id="rDRatio">—</dd>
      <dt>発動率の比（参考）</dt><dd id="rRatio">—</dd>
    </dl>
  </section>

  <section>
    <h2>記録</h2>
    <ul class="log" id="log"></ul>
  </section>
  <button class="reset" id="reset">入力をすべて消す</button>
</main>

<div class="bar" role="status" aria-live="polite">
  <div class="bar-in">
    <div><small>無補正比</small><b id="bRatio" class="dim">—</b></div>
    <div class="rankcell"><small>上位</small><b id="bRank" class="dim">—</b><span class="pos" id="bPos"></span></div>
    <div><small>何匹に1匹</small><b id="bOdds" class="dim">—</b></div>
    <button class="save" id="save" disabled>記録</button>
  </div>
</div>

<script>
(function(){
const BASE=2300,P0=0.029,CEIL=62,SLEEP=8.5,CAP0=24,ING_P=0.16,ING=[1,2,4],DAYS=5,UNLOCK=[10,25,50,70];
let N=3;const LVOF=()=>N===4?70:60;
const eff=p=>p>=1?1:p/(1-(1-p)**CEIL);
const SUBS=[
  {id:'skM',name:'スキルM',w:6,skill:.36},
  {id:'skS',name:'スキルS',w:12.5,skill:.18},
  {id:'spM',name:'おてスピM',w:6,speed:.14},
  {id:'spS',name:'おてスピS',w:12.5,speed:.07},
  {id:'hb',name:'おてボ',w:2,speed:.05,gold:1},
  {id:'invS',name:'所持数S',w:12.5,inv:6},{id:'invM',name:'所持数M',w:6,inv:12},{id:'invL',name:'所持数L',w:6,inv:18},{id:'x1',w:2},{id:'x5',w:6},{id:'x6',w:12.5},
  {id:'x7',w:6},{id:'x8',w:2},{id:'x9',w:2},{id:'x10',w:2},{id:'x11',w:2},{id:'x12',w:2}
];
const PICK=['skM','skS','spM','spS','hb','invS','invM','invL','none'];
const byId=Object.fromEntries(SUBS.map(s=>[s.id,s]));
const NAT=[
 ['さみしがり','sp','en'],['いじっぱり','sp','ig'],['やんちゃ','sp','sk'],['ゆうかん','sp','ex'],
 ['ずぶとい','en','sp'],['わんぱく','en','ig'],['のうてんき','en','sk'],['のんき','en','ex'],
 ['ひかえめ','ig','sp'],['おっとり','ig','en'],['うっかりや','ig','sk'],['れいせい','ig','ex'],
 ['おだやか','sk','sp'],['おとなしい','sk','en'],['しんちょう','sk','ig'],['なまいき','sk','ex'],
 ['おくびょう','ex','sp'],['せっかち','ex','en'],['ようき','ex','ig'],['むじゃき','ex','sk'],
 ['がんばりや',null,null],['すなお',null,null],['てれや',null,null],['きまぐれ',null,null],['まじめ',null,null]
];
const cat=s=>s==='sp'||s==='speed'?'speed':s==='sk'||s==='skill'?'skill':'other';
const NATL={skill:'スキル',speed:'おてスピ',other:'なし他'};

function mults(subs,up,down){
  let sk=0,sp=0,inv=0;
  subs.forEach(id=>{const s=byId[id];if(s){sk+=s.skill||0;sp+=s.speed||0;inv+=s.inv||0;}});
  return mk(sk,sp,inv,up,down);
}
function mk(sk,sp,inv,up,down){
  const skillMul=(up==='skill'?1.2:1)*(down==='skill'?0.8:1)*(1+sk);
  const timeMul=(up==='speed'?0.9:1)*(down==='speed'?1.075:1)*(1-Math.min(.35,sp));
  return {skillMul,timeMul,cap:CAP0+inv,ratio:eff(P0*skillMul)/eff(P0)/timeMul};
}
const MC={};
const envKey=()=>N+'|'+$('camp').checked+'|'+$('g80').checked;
function metric(m){
  const key=envKey()+'|'+m.skillMul.toFixed(6)+'|'+m.timeMul.toFixed(6)+'|'+m.cap;
  if(!(key in MC)){const r=daily(m.timeMul,m.skillMul,$('camp').checked,m.cap,$('g80').checked);MC[key]=r.day+r.night;}
  return MC[key];
}
const baseMetric=()=>metric({skillMul:1,timeMul:1,cap:CAP0});
const score=(subs,up,down)=>metric(mults(subs,up,down))/baseMetric();
const NP=[['skill','speed'],['skill','other'],['speed','skill'],['speed','other'],['other','skill'],['other','speed'],['other','other']];
const DISTS={},PATS={};
function buildDist(){
  const n=N,W=SUBS.reduce((a,s)=>a+s.w,0),nc={},sums=new Map(),acc=new Map();
  NAT.forEach(([,u,d])=>{const k=cat(u)+'|'+cat(d);nc[k]=(nc[k]||0)+1/25;});
  const ncs=Object.entries(nc).map(([k,v])=>[...k.split('|'),v]);
  const rec=(depth,mask,used,p,sk,sp,inv)=>{
    if(depth===n){const k=sk.toFixed(4)+'|'+Math.min(.35,sp).toFixed(4)+'|'+inv,e=sums.get(k);
      if(e)e.p+=p;else sums.set(k,{sk,sp,inv,p});return;}
    const rest=W-used;
    for(let i=0;i<SUBS.length;i++){if(mask&(1<<i))continue;const s=SUBS[i];
      rec(depth+1,mask|(1<<i),used+s.w,p*s.w/rest,sk+(s.skill||0),sp+(s.speed||0),inv+(s.inv||0));}
  };
  rec(0,0,0,1,0,0,0);
  const b=baseMetric();
  for(const{sk,sp,inv,p}of sums.values())for(const[u,d,v]of ncs){
    const r=metric(mk(sk,sp,inv,u,d))/b,k=r.toFixed(9);acc.set(k,(acc.get(k)||0)+p*v);}
  return[...acc].map(([r,p])=>({r:+r,p}));
}
const dist=()=>{const k=envKey();return DISTS[k]||(DISTS[k]=buildDist());};
function patterns(){
  const k=envKey();if(PATS[k])return PATS[k];
  const n=N,real=PICK.filter(x=>x!=='none'),out=[];
  const rec=(start,chosen)=>{
    const subs=[...chosen,...Array(n-chosen.length).fill('none')];NP.forEach(([u,d])=>out.push(score(subs,u,d)));
    if(chosen.length===n)return;
    for(let i=start;i<real.length;i++)rec(i+1,[...chosen,real[i]]);
  };
  rec(0,[]);
  return PATS[k]=out;
}
const ready=()=>{const k=envKey();return !!(DISTS[k]&&PATS[k]);};
let pending=false;
function warm(){if(ready()||pending)return;pending=true;
  setTimeout(()=>{try{dist();patterns();}finally{pending=false;}renderBar();renderLog();},40);}
const patRank=r=>{const P=patterns();return {k:1+P.filter(x=>x>r*(1+1e-7)).length,total:P.length};};
const atLeast=r=>dist().reduce((a,x)=>a+(x.r>=r*(1-1e-7)?x.p:0),0);

const st={subs:[null,null,null,null],up:null,down:null};
const $=id=>document.getElementById(id);
const cur=()=>st.subs.slice(0,N);
const done=()=>cur().every(Boolean)&&st.up&&st.down;
const chipHtml=(v,label,pressed,dis,cls)=>`<button class="chip ${cls||''}" data-v="${v}" aria-pressed="${pressed}" ${dis?'disabled':''}>${label}</button>`;

function renderSlots(){
  $('slots').innerHTML=UNLOCK.slice(0,N).map((lv,i)=>{
    const used=cur().filter((v,j)=>j!==i&&v&&v!=='none');
    return `<div class="slot"><span>Lv.${lv}</span><div class="chips" data-i="${i}">${PICK.map(id=>{
      const s=byId[id];return chipHtml(id,id==='none'?'なし他':s.name,st.subs[i]===id,used.includes(id),s&&s.gold?'hb':'');}).join('')}</div></div>`;
  }).join('');
  $('slots').querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const i=+g.dataset.i,v=b.dataset.v;st.subs[i]=st.subs[i]===v?null:v;update();}));
}
function renderNat(){
  ['up','down'].forEach(k=>{
    const other=k==='up'?st.down:st.up;
    $(k).innerHTML=['skill','speed','other'].map(c=>chipHtml(c,NATL[c],st[k]===c,c!=='other'&&other===c)).join('');
    $(k).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st[k]=st[k]===b.dataset.v?null:b.dataset.v;$('nat').value='';update();});
  });
}
$('nat').innerHTML='<option value="">選ぶと上昇・下降が入ります</option>'+NAT.map(n=>`<option>${n[0]}</option>`).join('');
$('nat').onchange=e=>{const n=NAT.find(x=>x[0]===e.target.value);if(!n)return;st.up=cat(n[1]);st.down=cat(n[2]);update();};

const trunc=x=>Math.trunc(x+1e-9);
const fmtPct=p=>{const v=p*100;return v>=0.01?v.toFixed(2)+'%':v.toPrecision(2)+'%';};
const band=e=>e>=81?.45:e>=61?.52:e>=41?.62:e>=21?.71:1;
function nightRolls(cap,Hs){
  // P[j]: 睡眠中にスキル抽選が行われるおてつだいがj回になる確率（所持数が満タンになると抽選終了）
  const P=new Float64Array(Hs+1);if(Hs===0){P[0]=1;return {P,full:0};}
  let d=new Float64Array(cap),n=new Float64Array(cap);d[0]=1;let prev=1;
  for(let j=1;j<=Hs;j++){n.fill(0);
    for(let c=0;c<cap;c++){const x=d[c];if(!x)continue;
      if(c+1<cap)n[c+1]+=x*(1-ING_P);
      for(const q of ING)if(c+q<cap)n[c+q]+=x*ING_P/ING.length;}
    [d,n]=[n,d];let s=0;for(let c=0;c<cap;c++)s+=d[c];
    if(j<Hs)P[j]=prev-s;else P[j]=prev;prev=s;}
  return {P,full:1-prev};
}
function daily(timeMul,skillMul,camp,cap,g80){
  const LV=LVOF(),T=Math.floor(BASE*(1-(LV-1)*0.002)*timeMul),Te=camp?T/1.2:T;
  const p=Math.min(1,P0*skillMul),aw=Math.round((24-SLEEP)*60);
  const bd=e=>g80?.45:band(e);
  let h=0;for(let t=0;t<aw;t++)h+=60/(Te*bd(Math.max(0,100-Math.floor(t/10))));
  const Hs=Math.floor(SLEEP*3600/(Te*bd(Math.max(0,100-Math.floor(aw/10))))),Ha=Math.round(h);
  const capE=camp?Math.ceil(cap*1.2):cap,{P:RP,full}=nightRolls(capE,Hs);
  let rolls=0;for(let j=0;j<=Hs;j++)rolls+=j*RP[j];
  let c=new Float64Array(CEIL),nb=new Float64Array(CEIL);c[0]=1;
  const mk=()=>[0,1,2].map(()=>new Float64Array(CEIL));
  let G=mk(),GN=mk();const F=mk();let day=0,night=0;
  for(let d=0;d<DAYS;d++){
    day=0;
    for(let i=0;i<Ha;i++){nb.fill(0);
      for(let k=0;k<CEIL;k++){const x=c[k];if(!x)continue;const w=k===CEIL-1?1:p;day+=x*w;nb[0]+=x*w;if(k<CEIL-1)nb[k+1]+=x*(1-w);}
      [c,nb]=[nb,c];}
    G[0].set(c);G[1].fill(0);G[2].fill(0);
    for(let s=0;s<3;s++)for(let k=0;k<CEIL;k++)F[s][k]=RP[0]*G[s][k];
    for(let i=0;i<Hs;i++){GN.forEach(a=>a.fill(0));
      for(let s=0;s<3;s++)for(let k=0;k<CEIL;k++){const x=G[s][k];if(!x)continue;
        if(s===2){GN[2][k]+=x;continue;}
        const w=k===CEIL-1?1:p;GN[s+1][0]+=x*w;if(k<CEIL-1)GN[s][k+1]+=x*(1-w);}
      [G,GN]=[GN,G];const wgt=RP[i+1];
      if(wgt)for(let s=0;s<3;s++)for(let k=0;k<CEIL;k++)F[s][k]+=wgt*G[s][k];}
    night=0;c.fill(0);
    for(let s=0;s<3;s++)for(let k=0;k<CEIL;k++){night+=s*F[s][k];c[k]+=F[s][k];}
  }
  return {T,Te,p,h,Ha,Hs,day,night,cap:capE,rolls,full};
}
const mmss=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+'時間':'')+(h?String(m).padStart(2,'0'):m)+'分'+String(s).padStart(2,'0')+'秒';};
function renderStats(){
  const m=mults(cur(),st.up,st.down),camp=$('camp').checked,g80=$('g80').checked;
  $('cond').textContent=`Lv.${LVOF()}・睡眠8.5時間・${g80?'げんき常時81%以上':'起床時げんき100（回復なし）'}・日中は常時タップで計算`;
  const r=daily(m.timeMul,m.skillMul,camp,m.cap,g80),base=baseMetric();
  const total=r.day+r.night,ok=done(),e=eff(r.p),avg=1/e;
  $('hAll').textContent=total.toFixed(2)+'回';$('hDay').textContent=r.day.toFixed(2);$('hNight').textContent=r.night.toFixed(2);
  const Tm=Math.floor(r.Te/60),Ts=Math.floor(r.Te%60);
  $('rTime').innerHTML=`${Tm}分${String(Ts).padStart(2,'0')}秒<span>${camp?'チケット込み・':''}げんき補正前</span>`;
  const cut=(1-m.timeMul)*100;$('rCut').innerHTML=`${cut>=0?'−':'+'}${trunc(Math.abs(cut))}%<span>性格・サブスキル合計</span>`;
  $('rHelps').innerHTML=`${(r.Ha+r.Hs)}回<span>日中${r.Ha}回・睡眠中${r.Hs}回</span>`;
  $('rCap').innerHTML=`${r.cap}個<span>${camp?'チケット込み（×1.2切り上げ）':'基礎24＋サブスキル'}</span>`;
  $('rRoll').innerHTML=`${r.rolls.toFixed(1)}回<span>睡眠中${r.Hs}回のうち・満タン確率${(r.full*100).toFixed(1)}%</span>`;
  $('rRate').innerHTML=`${(r.p*100).toFixed(2)}%<span>基礎2.9% × ${m.skillMul.toFixed(3)}</span>`;
  $('rEff').innerHTML=`${(e*100).toFixed(2)}%<span>62回目で確定を含む平均</span>`;
  $('rAvg').textContent=avg.toFixed(1)+'回';
  $('rAvgT').innerHTML=`${mmss(avg*r.Te*0.45)}<span>げんき81%以上のとき</span>`;
  $('rBase').textContent=base.toFixed(2)+'回';
  $('rDRatio').textContent=ok?(total/base).toFixed(2)+'倍':'—';
  $('rRatio').textContent=ok?m.ratio.toFixed(2)+'倍':'—';
}
[['camp','m2camp',true],['g80','m2g80',false]].forEach(([id,k,def])=>{
  try{const v=localStorage.getItem(k);$(id).checked=v===null?def:v==='1';}catch(e){$(id).checked=def;}
  $(id).addEventListener('change',()=>{try{localStorage.setItem(k,$(id).checked?'1':'0');}catch(e){}renderStats();renderBar();renderLog();});
});
function renderBar(){
  const ok=done();
  ['bRatio','bRank','bOdds'].forEach(id=>$(id).classList.toggle('dim',!ok));
  $('save').disabled=!ok;
  if(!ok){['bRatio','bRank','bOdds'].forEach(id=>$(id).textContent='—');$('bPos').textContent='';return;}
  const r=score(cur(),st.up,st.down);
  if(!ready()){$('bRatio').textContent=r.toFixed(2)+'倍';$('bRank').textContent='計算中';$('bPos').textContent='';$('bOdds').textContent='…';warm();return;}
  const ge=atLeast(r);
  $('bRatio').textContent=r.toFixed(2)+'倍';
  $('bRank').textContent=fmtPct(ge);
  const pr=patRank(r);$('bPos').textContent=`${pr.k}位/${pr.total}`;
  $('bOdds').textContent=Math.round(1/ge).toLocaleString()+'匹';
}
function renderMode(){document.querySelectorAll('.mode button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===N)));}
function update(){renderMode();renderSlots();renderNat();renderStats();renderBar();}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{N=+b.dataset.n;try{localStorage.setItem('m2mode',N);}catch(e){}update();renderLog();});
try{const v=+localStorage.getItem('m2mode');if(v===4)N=4;}catch(e){}

const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const nm=id=>byId[id]&&byId[id].name?byId[id].name:'なし他';
function renderLog(){
  const rd=ready();if(!rd)warm();
  const L=load('m2log',[]).filter(x=>x.subs.length===N).map(x=>{const up=cat(x.up),down=cat(x.down),n=x.subs.length;return {...x,up,down,n,r:score(x.subs,up,down)};}).sort((a,b)=>b.r-a.r);
  $('log').innerHTML=L.length?L.map(x=>`<li><div>${x.memo||'—'}<div class="m">${x.subs.map(nm).join('／')}　▲${NATL[x.up]} ▼${NATL[x.down]}</div></div><div><b>${x.r.toFixed(2)}倍</b><div class="m">上位${rd?fmtPct(atLeast(x.r)):'計算中'}</div></div><button class="del" data-t="${x.t}">削除</button></li>`).join(''):`<li class="empty">${N===4?'Lv.70まで':'Lv.50まで'}の記録はまだありません</li>`;
  $('log').querySelectorAll('.del').forEach(b=>b.onclick=()=>{save('m2log',load('m2log',[]).filter(x=>String(x.t)!==b.dataset.t));renderLog();});
}
$('save').onclick=()=>{if(!done())return;
  const memo=prompt('メモ（空欄可）','')||'';
  const L=load('m2log',[]);L.push({t:Date.now(),memo:memo.trim(),subs:cur(),up:st.up,down:st.down});
  save('m2log',L);renderLog();$('save').textContent='記録済';setTimeout(()=>$('save').textContent='記録',1200);};
$('reset').onclick=()=>{st.subs=[null,null,null,null];st.up=st.down=null;$('nat').value='';update();window.scrollTo({top:0});};

renderLog();update();
})();
</script>
